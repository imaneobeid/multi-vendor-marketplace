# The free backend host puts the server to sleep after 15 minutes without visitors, and waking it
# can take a minute or two. This job visits the server so it is awake when people arrive.
#
# Note: GitHub runs scheduled jobs when it has capacity, so they can be delayed by hours.
# This job helps, but it is not a guarantee (see the README, "Cold starts").
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Step 1 wakes the server. A slow wake-up is normal, so this step never fails the job.
      - name: Wake the server (can take a minute or two)
        run: |
          curl -sS --max-time 150 -o /dev/null \
            -w "Wake-up answered with HTTP %{http_code} after %{time_total}s\n" \
            https://souk-api.onrender.com/api/health || echo "No answer yet, checking once more below"

      # Step 2 fails only if the server is STILL not answering after it had time to wake up.
      - name: Check that it is awake
        run: curl -fsS --max-time 60 --retry 2 --retry-delay 20 https://souk-api.onrender.com/api/health
