# The free backend host puts the server to sleep after 15 minutes without visitors, and waking it
# takes up to a minute. This job visits the server every few minutes so it stays awake.
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the API health address
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 15 https://souk-api.onrender.com/api/health
